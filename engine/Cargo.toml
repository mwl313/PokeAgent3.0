[package]
name = "pa3-engine"
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
publish = false

[lib]
name = "pa3_engine"
crate-type = ["rlib", "cdylib"]

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
rayon = "1.11"
smallvec = "=1.15.1"
sha2 = "0.10"
pyo3 = { version = "0.26", features = ["extension-module"], optional = true }
